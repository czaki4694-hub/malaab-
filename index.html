<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملعب – كرة القدم والأفلام والمسلسلات والأخبار</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E1220"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
:root{--bg:#F5F6FA;--sf:#FFFFFF;--sf2:#E9ECF4;--tx:#141828;--mu:#5E6580;--ac:#C98A0B;--acx:#fff;--lv:#E5484D;--gr:#1E9E5A;--ln:#D8DCE8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1220;--sf:#171C30;--sf2:#212844;--tx:#EDEFF7;--mu:#9AA2C0;--ac:#F2B84B;--acx:#1a1300;--ln:#2A3152}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1220;--sf:#171C30;--sf2:#212844;--tx:#EDEFF7;--mu:#9AA2C0;--ac:#F2B84B;--acx:#1a1300;--ln:#2A3152}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Readex Pro',Tahoma,sans-serif;line-height:1.6;padding-bottom:76px;max-width:900px;margin-inline:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg)}
header h1{font-size:1.35rem;font-weight:700;flex:1}
header h1 i{font-style:normal;color:var(--ac)}
.ib{width:40px;height:40px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center}
main{padding:0 16px}
.sec{display:none}.sec.on{display:block}
h2{font-size:1.05rem;margin:22px 0 10px;font-weight:600}
.hero{border-radius:20px;padding:20px;background:linear-gradient(135deg,#1E9E5A,#0E5A44 55%,#13203A);color:#fff;position:relative;overflow:hidden}
.hero small{background:var(--lv);padding:2px 10px;border-radius:99px;font-size:.75rem}
.hero .sc{display:flex;align-items:center;justify-content:space-around;margin:14px 0;font-weight:700}
.hero .sc b{font-size:2.4rem;letter-spacing:2px}
.hero .tm{text-align:center;font-size:.9rem;flex:1}
.hero button,.btn{background:var(--ac);color:var(--acx);padding:10px 20px;border-radius:12px;font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.card{flex:0 0 132px;text-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.grid .card{flex:auto}
.po{aspect-ratio:2/3;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font-weight:700;font-size:.95rem;color:#fff;position:relative;overflow:hidden;line-height:1.3}
.po em{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.5);padding:0 8px;border-radius:8px;font-size:.72rem;font-style:normal}
.card p{font-size:.8rem;color:var(--mu);margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{padding:6px 16px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);white-space:nowrap;font-size:.88rem}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);margin:6px 0 8px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:center}
.match .t{font-weight:600;font-size:.95rem}
.match .s{font-size:1.3rem;font-weight:700;min-width:70px}
.match .m{grid-column:1/-1;font-size:.78rem;color:var(--mu)}
.lv{color:var(--lv);font-weight:600}
.tbl{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:.88rem;text-align:center}
th,td{padding:10px 8px}th{color:var(--mu);font-weight:400;border-bottom:1px solid var(--ln)}
td:nth-child(2){text-align:start;font-weight:600}
tr:nth-child(-n+4) td:first-child{color:var(--gr);font-weight:700}
.news{display:flex;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:start}
.news .th{flex:0 0 84px;height:84px;border-radius:12px}
.news h3{font-size:.95rem;line-height:1.5;font-weight:600}
.news p{font-size:.78rem;color:var(--mu);margin-top:6px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:900px;margin-inline:auto;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mu);padding:6px 0}
nav button.on{color:var(--ac);font-weight:600}
nav svg{width:22px;height:22px}
dialog{border:0;padding:0;width:min(100%,720px);max-width:100%;background:var(--bg);color:var(--tx);border-radius:20px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
.pl{aspect-ratio:16/9;background:#000;border-radius:20px 20px 0 0;display:grid;place-items:center;color:#9aa;font-size:.85rem;text-align:center;padding:10px}
.pl video,.pl iframe{width:100%;height:100%;border:0}
.pb{padding:16px;display:grid;gap:12px}
.pb h3{font-size:1.1rem}.pb p{color:var(--mu);font-size:.88rem}
.pb input{padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);direction:ltr;width:100%}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:.88rem}
.seg button.on{background:var(--ac);color:var(--acx);font-weight:600}
.acts{display:flex;gap:10px}.acts .btn{flex:1}
.btn.g{background:var(--sf2);color:var(--tx)}
.note{font-size:.74rem;color:var(--mu)}
.chn{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:start}.chn .lg{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto;font-size:1.1rem}.chn small{color:var(--mu)}
.empty{padding:30px;text-align:center;color:var(--mu)}
@media (prefers-reduced-motion:no-preference){.hero b{animation:p 2s ease-in-out infinite alternate}@keyframes p{to{opacity:.8}}}
</style>
</head>
<body>
<header><h1>ملعب<i>.</i></h1><button class="ib" id="th" aria-label="تغيير المظهر">◐</button></header>
<main>
<section class="sec on" id="home"></section>
<section class="sec" id="foot"></section>
<section class="sec" id="mov"></section>
<section class="sec" id="ser"></section>
<section class="sec" id="ch"></section>
<section class="sec" id="new"></section>
</main>
<nav id="nav"></nav>
<dialog id="dlg"><div class="pl" id="pl"></div><div class="pb">
<h3 id="pt"></h3><p id="pd"></p>
<div class="seg" role="tablist"><button data-m="int" class="on">مشغل داخلي</button><button data-m="ext">مشغل خارجي</button></div>
<input id="pu" placeholder="https://.../video.mp4 أو .m3u8" aria-label="رابط المصدر">
<a id="site" class="btn g" target="_blank" rel="noopener" hidden style="text-align:center">الموقع الرسمي للقناة</a>
<div class="acts"><button class="btn" id="go">شغّل</button><button class="btn g" id="fav">أضف للمفضلة</button><button class="btn g" id="cl">إغلاق</button></div>
<p class="note">استعمل فقط روابط عندك حق بثها (محتواك أو مصادر مرخصة). المشغل الداخلي كيدعم MP4 وHLS، والخارجي كيدعم روابط التضمين.</p>
</div></dialog>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const bg=t=>{const h=hue(t);return`linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 60% 20%))`};
const MOV=[["ليلة الدار البيضاء","دراما","2024"],["آخر قطار","إثارة","2023"],["صحراء الذهب","مغامرة","2022"],["أسرار الميناء","جريمة","2024"],["ضحكة العيد","كوميديا","2023"],["نجوم الأطلس","وثائقي","2025"],["الحارس","أكشن","2022"],["ظل الريح","دراما","2021"]];
const SER=[["أولاد الحومة","دراما","3 مواسم"],["الدرب","جريمة","موسمان"],["رمضان في الزقاق","كوميديا","5 مواسم"],["حدود","إثارة","موسم واحد"],["بحر الشمال","مغامرة","موسمان"],["ورثة","دراما","4 مواسم"]];
const MT=[["live","الرجاء","الوداد","2","1","الدقيقة 67","البطولة"],["live","ريال مدريد","برشلونة","1","1","الدقيقة 34","الليغا"],["soon","نهضة بركان","الجيش الملكي","–","–","اليوم 21:00","البطولة"],["soon","ليفربول","آرسنال","–","–","غدا 18:30","البريميرليغ"],["end","المغرب التطواني","الفتح","0","2","انتهت","البطولة"],["end","بايرن","دورتموند","3","2","انتهت","البوندسليغا"]];
const TB=["الجيش الملكي","نهضة بركان","الرجاء","الوداد","الفتح","المغرب التطواني","حسنية أكادير","أولمبيك آسفي"].map((n,i)=>[n,14,10-i>6?10-i:6-(i-4)*0+0,0,0,0]);
TB.forEach((r,i)=>{r[2]=9-Math.floor(i/2);r[3]=2+(i%3);r[4]=14-r[2]-r[3];r[5]=r[2]*3+r[3]});
const CH=[["الجزيرة","أخبار","https://www.aljazeera.net"],["العربية","أخبار","https://www.alarabiya.net"],["سكاي نيوز عربية","أخبار","https://www.skynewsarabia.com"],["فرانس 24 بالعربية","أخبار","https://www.france24.com/ar"],["DW عربية","أخبار","https://www.dw.com/ar"],["بي بي سي عربي","أخبار","https://www.bbc.com/arabic"],["ميدي 1 تيفي","أخبار","https://www.medi1tv.com"],["القناة الثانية 2M","أخبار","https://2m.ma"],["سبيستون","رسوم متحركة","https://www.spacetoon.com"],["طيور بيبي","رسوم متحركة","https://www.toyorbaby.com"],["MBC 3","رسوم متحركة",""],["كرتون نتورك بالعربية","رسوم متحركة",""],["جيم","رسوم متحركة",""],["براعم","رسوم متحركة",""]];
const chl=c=>CH.map((x,i)=>[x,i]).filter(([x])=>!c||x[1]==c).map(([x,i])=>`<button class="chn" data-k="ch" data-i="${i}"><span class="lg" style="background:${bg(x[0])}">${x[0][0]}</span><span><b>${x[0]}</b><br><small>${x[1]}</small></span></button>`).join('');
const NW=[["تشكيلة المنتخب الوطني تتعزز بعودة لاعبين مصابين","كرة القدم","منذ ساعة"],["الرجاء والوداد: ديربي مشتعل بأرقام قياسية","كرة القدم","منذ 3 ساعات"],["مهرجان مراكش للفيلم: برنامج الدورة المقبلة","سينما","اليوم"],["موسم جديد من مسلسل الدرب ينطلق الأسبوع المقبل","مسلسلات","أمس"],["نتائج الجولة الـ14 من البطولة الاحترافية","كرة القدم","أمس"],["أفلام مغربية تنافس في مهرجانات دولية","سينما","منذ يومين"]];
let fav=[];try{fav=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const sv=()=>{try{localStorage.setItem('fav',JSON.stringify(fav))}catch(e){}};
const ICO={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',foot:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',mov:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/>',ser:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',ch:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/>',new:'<path d="M5 4h12a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/>'};
const TABS=[["home","الرئيسية"],["foot","كرة القدم"],["mov","أفلام"],["ser","مسلسلات"],["ch","قنوات"],["new","أخبار"]];
$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>${l}</button>`).join('');
const poster=(t,tag,sub,kind,i)=>`<button class="card" data-k="${kind}" data-i="${i}"><div class="po" style="background:${bg(t)}"><em>${tag}</em>${t}</div><p>${sub}</p></button>`;
const matchH=(m,i)=>`<button class="match" data-k="match" data-i="${i}"><span class="t">${m[1]}</span><span class="s ${m[0]=='live'?'lv':''}">${m[3]} : ${m[4]}</span><span class="t">${m[2]}</span><span class="m">${m[0]=='live'?'<span class="lv">● مباشر</span> · ':''}${m[5]} · ${m[6]}</span></button>`;
const newsH=(n,i)=>`<button class="news" data-k="news" data-i="${i}"><div class="th" style="background:${bg(n[0])}"></div><div><h3>${n[0]}</h3><p>${n[1]} · ${n[2]}</p></div></button>`;
function grid(id,arr,kind,q='',g=''){return arr.map((x,i)=>[x,i]).filter(([x])=>x[0].includes(q)&&(!g||x[1]==g)).map(([x,i])=>poster(x[0],x[1],x[2],kind,i)).join('')||'<div class="empty">ما لقينا نتيجة. جرّب كلمة أخرى.</div>'}
function build(){
const m0=MT[0];
$('#home').innerHTML=`<div class="hero"><small>● مباشر</small><div class="sc"><span class="tm">${m0[1]}</span><b>${m0[3]} : ${m0[4]}</b><span class="tm">${m0[2]}</span></div><div style="text-align:center"><button data-k="match" data-i="0">شاهد المباراة</button></div></div>
<h2>مباريات اليوم</h2>${MT.slice(0,3).map(matchH).join('')}
<h2>أفلام جديدة</h2><div class="row">${MOV.slice(0,6).map((x,i)=>poster(x[0],x[1],x[2],'mov',i)).join('')}</div>
<h2>مسلسلات رائجة</h2><div class="row">${SER.map((x,i)=>poster(x[0],x[1],x[2],'ser',i)).join('')}</div>
<h2>آخر الأخبار</h2>${NW.slice(0,3).map(newsH).join('')}`;
$('#foot').innerHTML=`<div class="chips" id="fc">${[["all","الكل"],["live","مباشر"],["soon","قادمة"],["end","نتائج"]].map(([k,l],i)=>`<button class="chip ${i?'':'on'}" data-f="${k}">${l}</button>`).join('')}</div><div id="ml"></div><h2>ترتيب البطولة</h2><div class="tbl"><table><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th><th>نقاط</th></tr>${TB.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><b>${r[5]}</b></td></tr>`).join('')}</table></div><p class="note" style="margin-top:8px">بيانات تجريبية للعرض.</p>`;
mlist('all');
for(const [id,arr,kind,gs] of [['mov',MOV,'mov',['كل الأنواع','دراما','إثارة','مغامرة','جريمة','كوميديا','وثائقي']],['ser',SER,'ser',['كل الأنواع','دراما','جريمة','كوميديا','إثارة','مغامرة']]]){
$('#'+id).innerHTML=`<input class="search" placeholder="ابحث..." aria-label="بحث" data-s="${id}"><div class="chips" data-c="${id}">${gs.map((g,i)=>`<button class="chip ${i?'':'on'}" data-g="${i?g:''}">${g}</button>`).join('')}</div><div class="grid" id="g${id}">${grid(id,arr,kind)}</div>`}
$('#ch').innerHTML=`<div class="chips">${['الكل','أخبار','رسوم متحركة'].map((c,i)=>`<button class="chip ${i?'':'on'}" data-h="${i?c:''}">${c}</button>`).join('')}</div><div id="chl">${chl('')}</div><p class="note">ألصق رابط البث الرسمي للقناة (مثلا رابط تضمين رسمي من يوتيوب) فالمشغل.</p>`;
$('#new').innerHTML=`<div class="chips">${['الكل','كرة القدم','سينما','مسلسلات'].map((c,i)=>`<button class="chip ${i?'':'on'}" data-n="${i?c:''}">${c}</button>`).join('')}</div><div id="nl">${NW.map(newsH).join('')}</div>`;
}
const mlist=f=>{$('#ml').innerHTML=MT.map((m,i)=>[m,i]).filter(([m])=>f=='all'||m[0]==f).map(([m,i])=>matchH(m,i)).join('')||'<div class="empty">ما كاين حتى مباراة.</div>'};
const st={mov:{q:'',g:''},ser:{q:'',g:''}};
function show(t){$$('.sec').forEach(s=>s.classList.toggle('on',s.id==t));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));scrollTo(0,0)}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-t]');if(t)return show(t.dataset.t);
const f=e.target.closest('[data-f]');if(f){$$('[data-f]').forEach(c=>c.classList.toggle('on',c==f));return mlist(f.dataset.f)}
const g=e.target.closest('[data-g]');if(g){const id=g.parentNode.dataset.c;$$(`[data-c="${id}"] .chip`).forEach(c=>c.classList.toggle('on',c==g));st[id].g=g.dataset.g;return $('#g'+id).innerHTML=grid(id,id=='mov'?MOV:SER,id,st[id].q,st[id].g)}
const h=e.target.closest('[data-h]');if(h){$$('[data-h]').forEach(c=>c.classList.toggle('on',c==h));return $('#chl').innerHTML=chl(h.dataset.h)}
const n=e.target.closest('[data-n]');if(n){$$('[data-n]').forEach(c=>c.classList.toggle('on',c==n));return $('#nl').innerHTML=NW.filter(x=>!n.dataset.n||x[1]==n.dataset.n).map(newsH).join('')}
const k=e.target.closest('[data-k]');if(k)open(k.dataset.k,+k.dataset.i)});
document.addEventListener('input',e=>{const id=e.target.dataset.s;if(!id)return;st[id].q=e.target.value;$('#g'+id).innerHTML=grid(id,id=='mov'?MOV:SER,id,st[id].q,st[id].g)});
let cur=null,mode='int',hls=null;
function open(k,i){
if(k=='news'){const n=NW[i];cur={id:'n'+i,t:n[0],d:n[1]+' · '+n[2]};$('#pl').innerHTML='<div style="width:100%;height:100%;border-radius:20px 20px 0 0;background:'+bg(n[0])+'"></div>';$('#pu').style.display='none';$('.seg').style.display='none';$('#go').style.display='none'}
else if(k=='ch'){const c=CH[i];cur={id:'ch'+i,t:c[0],d:c[1]};$('#pl').textContent='ألصق رابط البث الرسمي للقناة وضغط على «شغّل»';$('#pu').style.display='';$('.seg').style.display='';$('#go').style.display='';$('#pu').value=''}
else{const x=k=='match'?MT[i]:(k=='mov'?MOV:SER)[i];cur={id:k+i,t:k=='match'?x[1]+' ضد '+x[2]:x[0],d:k=='match'?x[6]+' · '+x[5]:x[1]+' · '+x[2]};$('#pl').textContent='ألصق رابط المصدر وضغط على «شغّل»';$('#pu').style.display='';$('.seg').style.display='';$('#go').style.display='';$('#pu').value=''}
const su=k=='ch'?CH[i][2]:'';$('#site').hidden=!su;if(su)$('#site').href=su;
$('#pt').textContent=cur.t;$('#pd').textContent=cur.d;fb();$('#dlg').showModal()}
const fb=()=>{$('#fav').textContent=fav.includes(cur.id)?'في المفضلة ✓':'أضف للمفضلة'};
$('#fav').onclick=()=>{fav=fav.includes(cur.id)?fav.filter(x=>x!=cur.id):[...fav,cur.id];sv();fb()};
$$('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('.seg button').forEach(x=>x.classList.toggle('on',x==b))});
function stop(){if(hls){hls.destroy();hls=null}$('#pl').innerHTML=''}
$('#go').onclick=()=>{const u=$('#pu').value.trim();if(!/^https?:\/\//.test(u)){$('#pl').textContent='الرابط خاصو يبدا بـ https://';return}
stop();const box=$('#pl');
if(mode=='ext'){const f=document.createElement('iframe');f.src=u;f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;box.append(f);return}
const v=document.createElement('video');v.controls=true;v.playsInline=true;v.autoplay=true;v.onerror=()=>{box.textContent='تعذر تشغيل هاد الرابط. تأكد من المصدر أو جرّب المشغل الخارجي.'};box.append(v);
if(/\.m3u8/.test(u)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)}else v.src=u};
$('#cl').onclick=()=>{stop();$('#dlg').close()};$('#dlg').addEventListener('close',stop);
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark')||r.dataset.theme=='dark';r.dataset.theme=d?'light':'dark'};
build();show('home');
try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
